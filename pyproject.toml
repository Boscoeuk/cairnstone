[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.1.0"
description = "Local-first memory compiler for AI agents: compiles captures into cited Markdown pages."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests",
]

[project.optional-dependencies]
mcp = [
    "mcp",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
