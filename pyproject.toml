[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairnstone"
version = "0.1.0"
description = "Local-first memory compiler for AI agents: compiles captures into cited Markdown pages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Boscoeuk" },
]
keywords = ["ai-agents", "memory", "rag", "local-first", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/Boscoeuk/cairnstone"
Repository = "https://github.com/Boscoeuk/cairnstone"
Issues = "https://github.com/Boscoeuk/cairnstone/issues"
Changelog = "https://github.com/Boscoeuk/cairnstone/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "mcp",
]
dev = [
    "pytest",
]

[project.scripts]
cairnstone = "cairnstone.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
